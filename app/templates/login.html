{% extends 'template.html' %}

{% block titulo %}Entrar{% endblock %}

{% block conteudo %}

<div class="form-page">
    <div class="form-card">
        <div class="form-card-icon">🔑</div>
        <h1>Entrar na GameShop</h1>
        <p class="form-subtitle">Acesse sua conta para continuar</p>

        {% if erro %}
            <div class="alert alert-error">{{ erro }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="field-group">
                <label>Usuário</label>
                <input type="text" name="username" placeholder="Seu usuário" required autofocus>
            </div>
            <div class="field-group">
                <label>Senha</label>
                <input type="password" name="password" placeholder="Sua senha" required>
            </div>
            <button type="submit" class="btn-submit">Entrar →</button>
        </form>

        <p class="form-footer">Não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a></p>
    </div>
</div>

{% endblock %}
