{% extends 'template.html' %}

{% block titulo %}Alterar Senha{% endblock %}

{% block conteudo %}

<div class="form-page">
    <div class="form-card">
        <div class="form-card-icon">🔒</div>
        <h1>Alterar Senha</h1>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="field-group">
                    <label>{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        {% for error in field.errors %}<span class="field-error">{{ error }}</span>{% endfor %}
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn-submit">Alterar Senha</button>
        </form>
    </div>
</div>

{% endblock %}
